model:
  name: stiff_chain
  version: "1.0"
  description: "Stiff linear chain A -> B -> C (k2/k1 = 1000) with a closed-form solution, for verification."
  references: []

species:
  - {name: A, default_concentration: 1.0}
  - {name: B, default_concentration: 0.0}
  - {name: C, default_concentration: 0.0}

conditions:
  - {name: T, default: 293.15}

reactions:
  - {name: r1, rate: "k1 * [A]", parameters: {k1: {value: 1.0}}, stoichiometry: {A: -1, B: 1}}
  - {name: r2, rate: "k2 * [B]", parameters: {k2: {value: 1000.0}}, stoichiometry: {B: -1, C: 1}}
